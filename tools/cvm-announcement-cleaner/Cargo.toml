[package]
name = "cvm-announcement-cleaner"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
contextvm-sdk = "0.1.1"
nostr-sdk = { version = "0.43", features = ["nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
